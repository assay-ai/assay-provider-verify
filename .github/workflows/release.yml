name: Release

# Push a tag to publish one package:
#   node/v0.1.0    -> npm  @goassay-ai/provider-verify
#   python/v0.1.0  -> PyPI goassay-provider-verify
#   go/v0.1.0      -> Go module (the tag itself is the release)
on:
  push:
    tags:
      - 'node/v*'
      - 'python/v*'
      - 'go/v*'

permissions:
  contents: read

jobs:
  npm:
    if: startsWith(github.ref_name, 'node/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing + provenance
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Tag matches package version
        run: test "${GITHUB_REF_NAME#node/v}" = "$(node -p "require('./package.json').version")"
        working-directory: node
      - run: npm ci
        working-directory: node
      - run: npm run typecheck
        working-directory: node
      - run: npm test
        working-directory: node
      - run: npm run build
        working-directory: node
      # Trusted publishing (OIDC): npmjs.com trusts this repository's release.yml, so no
      # token is stored anywhere. It needs npm 11.5.1 or newer; Node 22 ships npm 10.
      - run: npm install -g npm@11.6.2
      - name: Skip a version that is already on npm
        id: published
        run: |
          if npm view "$(node -p "require('./package.json').name")@${GITHUB_REF_NAME#node/v}" version >/dev/null 2>&1; then
            echo "already=true" >> "$GITHUB_OUTPUT"
          fi
        working-directory: node
      - if: steps.published.outputs.already != 'true'
        run: npm publish --access public --provenance
        working-directory: node

  pypi:
    if: startsWith(github.ref_name, 'python/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write # PyPI trusted publishing
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Tag matches package version
        run: test "${GITHUB_REF_NAME#python/v}" = "$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
        working-directory: python
      - run: pip install -e '.[test]' build
        working-directory: python
      - run: pytest
        working-directory: python
      - run: python -m build
        working-directory: python
      # Preferred: trusted publishing. The "environment: pypi" line above is required
      # for it and must match the environment name set on pypi.org. Add this repository and the "pypi"
      # environment as a trusted publisher on pypi.org, then no secret is needed.
      # Fallback: create a repository secret PYPI_TOKEN and uncomment "password".
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: python/dist
          # password: ${{ secrets.PYPI_TOKEN }}

  go:
    if: startsWith(github.ref_name, 'go/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.22'
      # Go modules are published by the tag alone (module path .../go, tag go/vX.Y.Z).
      - run: go test ./...
        working-directory: go
