name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  vectors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Negative vectors are up to date
        run: |
          node scripts/make-negative-vectors.mjs
          git diff --exit-code test-vectors/negative.json

  node:
    runs-on: ubuntu-latest
    if: hashFiles('node/package.json') != ''
    defaults:
      run:
        working-directory: node
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test

  python:
    runs-on: ubuntu-latest
    if: hashFiles('python/pyproject.toml') != ''
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e '.[test]'
      - run: pytest

  go:
    runs-on: ubuntu-latest
    if: hashFiles('go/go.mod') != ''
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - run: go test ./...
