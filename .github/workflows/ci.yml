name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  vectors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Negative vectors are up to date
        run: |
          node scripts/make-negative-vectors.mjs
          git diff --exit-code test-vectors/negative.json

  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: present
        run: if test -f node/package.json; then echo present=true >> "$GITHUB_OUTPUT"; else echo present=false >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@v4
        if: steps.present.outputs.present == 'true'
        with:
          node-version: 22
      - run: npm ci
        if: steps.present.outputs.present == 'true'
        working-directory: node
      - run: npm test
        if: steps.present.outputs.present == 'true'
        working-directory: node

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: present
        run: if test -f python/pyproject.toml; then echo present=true >> "$GITHUB_OUTPUT"; else echo present=false >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-python@v5
        if: steps.present.outputs.present == 'true'
        with:
          python-version: '3.12'
      - run: pip install -e '.[test]'
        if: steps.present.outputs.present == 'true'
        working-directory: python
      - run: pytest
        if: steps.present.outputs.present == 'true'
        working-directory: python

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: present
        run: if test -f go/go.mod; then echo present=true >> "$GITHUB_OUTPUT"; else echo present=false >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-go@v5
        if: steps.present.outputs.present == 'true'
        with:
          go-version: '1.22'
      - run: go test ./...
        if: steps.present.outputs.present == 'true'
        working-directory: go
