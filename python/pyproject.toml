[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "goassay-provider-verify"
version = "0.1.0"
description = "Verify Assay Ed25519 request signatures (RFC 9421 style) with ASGI and WSGI middleware."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
dependencies = ["cryptography>=42"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Typing :: Typed",
]

[project.optional-dependencies]
redis = ["redis>=5"]
fastapi = ["fastapi>=0.110"]
flask = ["flask>=3"]
test = ["pytest==9.1.1", "httpx==0.28.1", "fastapi==0.142.2", "starlette==1.7.0", "flask==3.1.3", "werkzeug==3.1.9"]

[project.urls]
Homepage = "https://github.com/assay-ai/assay-provider-verify"
Source = "https://github.com/assay-ai/assay-provider-verify/tree/main/python"
Issues = "https://github.com/assay-ai/assay-provider-verify/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
goassay_provider_verify = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient` is deprecated:Warning"]
