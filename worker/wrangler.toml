name = "assay-verify-gateway"
main = "src/index.ts"
compatibility_date = "2026-10-01"

[vars]
# Where valid requests are forwarded. Required. Scheme and host, optional path prefix.
ORIGIN_URL = "https://origin.example.com"
# Your Assay provider id, shown in the portal. Required: while it is empty the
# Worker answers 500 and forwards nothing. Several ids may be comma-separated.
# Requests that Assay signed for any other provider are refused (WRONG_PROVIDER).
ASSAY_PROVIDER_ID = ""
# Optional: use a different key set, for example testnet:
# JWKS_URL = "https://api-dev.goassay.ai/.well-known/assay-request-keys.json"

# Optional secret header the Worker adds so your origin can accept only the Worker.
# Set it with: npx wrangler secret put ORIGIN_SECRET
# The value is sent as the "x-assay-origin-secret" header.

# Optional replay protection that works across all Worker instances.
# Without it, replays are only caught inside one Worker isolate (best effort).
# The Durable Object adds one extra round trip per request, so also set
# NONCE_LOCATION_HINT (for example "weur", "enam", "apac") under [vars] to a
# region close to your origin. Uncomment the blocks below to enable.
#
# [[durable_objects.bindings]]
# name = "NONCE_STORE"
# class_name = "NonceStore"
#
# [[migrations]]
# tag = "v1"
# new_sqlite_classes = ["NonceStore"]
